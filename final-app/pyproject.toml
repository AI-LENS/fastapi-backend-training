[project]
name = "subject-enrollment-service"
version = "1.0.0"
description = "FastAPI clinical-trial enrollment training reference"
requires-python = ">=3.10"
dependencies = [
    # Web
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    # Validation / config
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.0.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.27",
    "aiosqlite>=0.20.0",
    # Auth
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<4.1",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    # Streaming
    "sse-starlette>=2.0.0",
    # Observability
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    # Performance
    "slowapi>=0.1.9",
    "cachetools>=5.3.0",
    # HTTP client (used by tests + reachable from app code)
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
